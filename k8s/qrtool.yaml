apiVersion: v1
kind: Namespace
metadata:
  name: qrtool
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrtool
  namespace: qrtool
  labels:
    app.kubernetes.io/name: qrtool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qrtool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qrtool
    spec:
      containers:
        - name: qrtool
          image: ghcr.io/bowl42/qrtool:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qrtool
  namespace: qrtool
  labels:
    app.kubernetes.io/name: qrtool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qrtool
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qrtool
  namespace: qrtool
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`qr.t0.homes`)
      services:
        - name: qrtool
          port: 80
  tls:
    secretName: t0-homes-tls
